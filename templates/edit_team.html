{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2><i class="bi bi-pencil-square"></i> Edit Team</h2>
    <form method="POST" enctype="multipart/form-data" class="mt-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="team_name" class="form-label">Team Name</label>
                <input type="text" class="form-control" id="team_name" name="team_name" value="{{ team.name }}" required>
            </div>
            <div class="col-md-6">
                <label for="owner" class="form-label">Owner</label>
                <input type="text" class="form-control" id="owner" name="owner" value="{{ team.owner }}" required>
            </div>
            <div class="col-md-12">
                <label for="logo" class="form-label">Team Logo (optional)</label>
                <input type="file" class="form-control" id="logo" name="logo" accept="image/*">
                {% if team.logo_path %}
                <div class="mt-2">
                    <img src="{{ team.logo_path }}" alt="Current Logo" style="max-height:100px;">
                    <p class="text-muted small">Current logo</p>
                </div>
                {% endif %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4">Update Team</button>
        <a href="{{ url_for('teams') }}" class="btn btn-secondary mt-4">Cancel</a>
    </form>
</div>
{% endblock %}
