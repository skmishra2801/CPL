{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2><i class="bi bi-wallet2"></i> Assign Funds to Teams</h2>
    <form method="POST" class="mt-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label for="amount" class="form-label">Amount per Team</label>
                <input type="number" class="form-control" id="amount" name="amount" value="10000" required>
            </div>
            <div class="col-md-6">
                <button type="submit" class="btn btn-warning">Assign to All Teams</button>
            </div>
        </div>
    </form>
    <hr>
    <h4>Current Team Funds</h4>
    {% if teams %}
    <table class="table table-bordered">
        <thead>
            <tr><th>Team</th><th>Owner</th><th>Funds</th></tr>
        </thead>
        <tbody>
            {% for team in teams %}
            <tr><td>{{ team.name }}</td><td>{{ team.owner }}</td><td>{{ team.remaining_funds }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="alert alert-info">No teams registered yet.</div>
    {% endif %}
</div>
{% endblock %}
