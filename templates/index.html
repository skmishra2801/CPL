{% extends "base.html" %}
{% block content %}
<div class="container text-center py-5">
    <h1 class="display-4 fw-bold"><i class="bi bi-trophy-fill text-warning"></i> City Club Premier League</h1>
    <p class="lead">Cricket Auction Management System</p>
    <hr class="my-4" />
    <div class="row g-4 mt-4">
        <div class="col-md-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-person-plus fs-1 text-primary"></i>
                    <h5 class="card-title">Register Player</h5>
                    <a href="{{ url_for('register_player') }}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-flag fs-1 text-success"></i>
                    <h5 class="card-title">Register Team</h5>
                    <a href="{{ url_for('register_team') }}" class="btn btn-success">Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-wallet2 fs-1 text-warning"></i>
                    <h5 class="card-title">Assign Funds</h5>
                    <a href="{{ url_for('assign_funds') }}" class="btn btn-warning">Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <i class="bi bi-hammer fs-1 text-danger"></i>
                    <h5 class="card-title">Auction</h5>
                    <a href="{{ url_for('auction') }}" class="btn btn-danger">Go</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
